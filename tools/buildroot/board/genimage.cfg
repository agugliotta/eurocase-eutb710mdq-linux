image boot.vfat {
    vfat {
        label = "TABLET_BOOT"
        extraargs = "-F 32"
        files = { "zImage", "board.dtb", "boot.scr" }
    }
    size = 64M
}
image sdcard.img {
    hdimage {
        partition-table-type = "mbr"
        fill = true
    }
    partition bootloader {
        in-partition-table = "no"
        image = "u-boot-sunxi-with-spl.bin"
        offset = 8K
    }
    partition boot {
        partition-type = 0x0c
        bootable = "true"
        image = "boot.vfat"
        offset = 1M
        size = 64M
    }
    partition rootfs {
        partition-type = 0x83
        image = "rootfs.squashfs"
        size = 32M
    }
}
